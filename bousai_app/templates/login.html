{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<h2>ログイン</h2>
<p>利用する画面を選択し、パスワード「123」を入力してください。</p>

{% if error %}
  <p>{{ message }}</p>
{% endif %}

<form method="post">
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <p>
    <label for="password">共通パスワード</label><br>
    <input type="password" id="password" name="password" required>
  </p>
  <p><button type="submit" name="role" value="resident">住民として利用する</button></p>
  <p><button type="submit" name="role" value="admin">管理者として利用する</button></p>
</form>

{% endblock %}
