<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --blue: #2d5bab;
      --blue-dark: #204b98;
      --ink: #263b58;
      --muted: #718197;
      --line: #edf1f5;
      --page: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    body.warning-active { background: #d97706; }

    .site-header {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 1px 4px rgba(31, 65, 120, .16);
    }

    .header-inner {
      position: relative;
      width: min(100% - 48px, 1380px);
      margin: 0 auto;
      padding: 20px 0 18px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .menu-toggle {
      display: inline-grid;
      position: absolute;
      top: 11px;
      left: 0;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 6px;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }

    .menu-toggle:hover,
    .menu-toggle:focus-visible { background: rgba(255, 255, 255, .16); }

    .menu-toggle:focus-visible,
    .menu-panel a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .menu-toggle-lines,
    .menu-toggle-lines::before,
    .menu-toggle-lines::after {
      display: block;
      width: 22px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      content: "";
    }

    .menu-toggle-lines { position: relative; }
    .menu-toggle-lines::before,
    .menu-toggle-lines::after { position: absolute; left: 0; }
    .menu-toggle-lines::before { top: -7px; }
    .menu-toggle-lines::after { top: 7px; }

    .menu-toggle[aria-expanded="true"] .menu-toggle-lines { background: transparent; }
    .menu-toggle[aria-expanded="true"] .menu-toggle-lines::before { top: 0; transform: rotate(45deg); }
    .menu-toggle[aria-expanded="true"] .menu-toggle-lines::after { top: 0; transform: rotate(-45deg); }

    .brand {
      margin-left: 56px;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1.3;
      text-decoration: none;
    }

    .language-button {
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 5px;
      color: #fff;
      background: transparent;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .language-button:hover { background: rgba(255, 255, 255, .16); }

    .menu-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 9px;
      padding: 0 0 13px;
      transition: opacity .2s ease, transform .2s ease;
    }

    .menu-panel[hidden] {
      display: none;
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 54px;
      padding: 8px 12px;
      color: #fff;
      font-size: 14px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 6px;
    }

    .menu-panel a:hover { background: rgba(255, 255, 255, .16); }

    .menu-icon {
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    main {
      width: min(100% - 48px, 910px);
      margin: 32px auto 70px;
    }

    .home-card {
      padding: 28px;
      margin-bottom: 36px;
      border: 1px solid #f0f3f7;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 5px 20px rgba(39, 72, 122, .08);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 20px;
      color: var(--blue-dark);
      font-size: 23px;
      font-weight: 700;
    }

    .section-heading span:first-child::first-letter { font-size: 1.1em; }

    .map {
      height: 365px;
      overflow: hidden;
      border-radius: 10px;
    }

    .test-run-button {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 1000;
      padding: 11px 18px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #c45a18;
      box-shadow: 0 3px 10px rgba(38, 59, 88, .24);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .test-run-button:hover { background: #a9470d; }
    .test-run-button.is-active { background: #6e7785; }

    .refresh-label {
      color: #269d55;
      font-size: 15px;
      white-space: nowrap;
    }

    .weather-panel {
      padding: 19px 20px;
      border-radius: 10px;
      background: #f8fafc;
    }

    .weather-panel p { margin: 0 0 13px; }
    .weather-panel p:last-child { margin-bottom: 0; }
    .weather-place { font-weight: 700; }
    .weather-status { color: #269d55; font-weight: 700; }
    .weather-meta { color: var(--muted); font-size: 14px; }

    .notification-list { display: grid; gap: 12px; }
    .notification-item {
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfcfe;
    }
    .notification-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .notification-header h3 { margin: 0 0 5px; font-size: 17px; }
    .notification-meta, .notification-clear, .notification-empty {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .notification-badge, .warning-status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-emergency { color: #fff; background: #c43d3d; }
    .badge-warning { color: #7b4500; background: #ffe1a6; }
    .badge-advisory { color: #155f37; background: #c9efd8; }
    .badge-clear { color: #526276; background: #e9eef4; }
    .badge-info { color: #155f37; background: #c9efd8; }
    .notification-warnings {
      display: grid;
      gap: 7px;
      margin: 13px 0 0;
      padding: 0;
      list-style: none;
    }
    .notification-warnings li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .warning-status { padding: 2px 7px; color: var(--blue-dark); background: #e4edff; }
    .notification-clear { margin-top: 13px; }
    .notification-empty { padding: 8px 0; }

    .last-login-time {
      margin: -18px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    @media (max-width: 600px) {
      .header-inner, main { width: min(100% - 28px, 910px); }
      .header-inner { padding: 16px 0 15px; }
      .brand { font-size: 20px; }
      .menu-toggle { top: 9px; }
      .menu-panel { gap: 5px; margin-top: 7px; padding-bottom: 10px; }
      .menu-panel a { min-height: 50px; padding: 7px 8px; gap: 6px; font-size: 13px; }
      .menu-icon { flex-basis: 21px; width: 21px; height: 21px; }
      main { margin-top: 20px; }
      .home-card { padding: 18px; margin-bottom: 20px; border-radius: 12px; }
      .section-heading { align-items: flex-start; font-size: 18px; }
      .refresh-label { font-size: 12px; }
      .map { height: 280px; }
      .test-run-button { left: 14px; bottom: 14px; }
      .notification-item { padding: 14px; }
      .notification-header { gap: 8px; }
      .notification-warnings li { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="メニューを開く">
          <span class="menu-toggle-lines" aria-hidden="true"></span>
        </button>
        <a class="brand" href="/">防災アプリ</a>
        <button class="language-button" type="button" aria-label="英語に翻訳">English</button>
      </div>
      <nav id="site-menu" class="menu-panel" aria-label="サイトメニュー" hidden>
        <a href="/">
          <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"></path><path d="M5 9v11h14V9"></path><path d="M9 20v-6h6v6"></path></svg>
          <span>ホーム</span>
        </a>
        <a href="/shelter_search">
          <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <span>避難所検索</span>
        </a>
        <a href="/shelter_register">
          <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"></path><path d="M12 8v8M8 12h8"></path></svg>
          <span>避難所登録</span>
        </a>
        <a href="/board">
          <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m4 10 12-4v12L4 14v-4Z"></path><path d="M16 9c2 1 3 2 3 3s-1 2-3 3M20 7c1.5 1.5 2 3 2 5s-.5 3.5-2 5"></path><path d="M4 14v5h3l2-4"></path></svg>
          <span>指示・発信ボード</span>
        </a>
        <a href="/contact">
          <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.7 9a2.4 2.4 0 1 1 4.1 1.7c-1.1 1-1.8 1.3-1.8 2.8M12 17h.01"></path></svg>
          <span>問い合わせ</span>
        </a>
        {% if session.logged_in %}
          <a href="/logout">
            <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M10 8v8M10 12h8M15 9l3 3-3 3"></path></svg>
            <span>ログアウト</span>
          </a>
        {% else %}
          <a href="/login">
            <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="3.5"></circle><path d="m10 13 9-9M15 8l2 2M12 11l2 2"></path></svg>
            <span>ログイン</span>
          </a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const translations = {
      '防災アプリ': 'Disaster Prevention App',
      '青森市': 'Aomori City',
      'ホーム': 'Home',
      '避難所検索': 'Shelter Search',
      '避難所登録': 'Register Shelter',
      '指示・発信ボード': 'Information Board',
      '問い合わせ': 'Contact',
      'ログアウト': 'Log out',
      'ログイン': 'Log in',
      '避難所マップ': 'Shelter Map',
      '青森市 気象警報・注意報': 'Aomori City Weather Warnings and Advisories',
      '10分おき自動更新': 'Automatically updated every 10 minutes',
      '通知履歴': 'Notification History',
      '対象地域不明': 'Unknown area',
      '通知日時:': 'Notification time:',
      '気象庁発表:': 'JMA announcement:',
      '緊急': 'Emergency',
      '警報': 'Warning',
      '注意報': 'Advisory',
      '雷注意報': 'Thunderstorm Advisory',
      '強風注意報': 'Strong Wind Advisory',
      '発表': 'Issued',
      '継続': 'Continuing',
      '発表なし': 'No warnings',
      'この時点で発表されている警報・注意報はありません。': 'No warnings or advisories were issued at this time.',
      '通知履歴はありません。': 'There is no notification history.',
      '読み込み中...': 'Loading...',
      '気象情報の取得に失敗しました': 'Failed to retrieve weather information',
      '現在、警報・注意報は発表されていません': 'There are currently no warnings or advisories.',
      'データ取得:': 'Data retrieved:',
      '気象庁発表: 不明': 'JMA announcement: Unknown',
      '避難所検索': 'Shelter Search',
      '登録されている避難所を確認できます。': 'View registered shelters.',
      '全施設一覧': 'All shelters',
      '検索結果': 'Search Results',
      '該当する避難所が見つかりませんでした': 'No matching shelters were found.',
      '検索画面に戻る': 'Back to search',
      'トップページへ戻る': 'Back to home',
      '新しい避難所情報を登録します。': 'Register a new shelter.',
      '避難所名（必須）': 'Shelter name (required)',
      '登録': 'Register',
      '避難所を登録しました。': 'The shelter has been registered.',
      '避難所名を入力してください。': 'Please enter a shelter name.',
      '管理者ログイン': 'Administrator Login',
      '指示ボード・避難所登録の利用には管理者権限が必要です。': 'Administrator access is required to use the information board and shelter registration.',
      'パスワード（「123」と入力してください）': 'Password (enter "123")',
      'パスワードが正しくありません。': 'The password is incorrect.',
      '発信ボード': 'Information Board',
      '住民向けの発信を登録・確認できます。': 'Register and review information for residents.',
      '発信一覧': 'Information List',
      '登録されている指示はありません。': 'There are no registered notices.',
      '内容': 'Content',
      '避難先:': 'Destination shelter:'
    };

    let isEnglish = false;

    const menuToggle = document.querySelector('.menu-toggle');
    const siteMenu = document.querySelector('#site-menu');

    function closeSiteMenu() {
      if (!menuToggle || !siteMenu) return;
      menuToggle.setAttribute('aria-expanded', 'false');
      menuToggle.setAttribute('aria-label', 'メニューを開く');
      siteMenu.hidden = true;
    }

    menuToggle?.addEventListener('click', () => {
      const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!isOpen));
      menuToggle.setAttribute('aria-label', isOpen ? 'メニューを開く' : 'メニューを閉じる');
      if (siteMenu) siteMenu.hidden = isOpen;
    });

    document.addEventListener('click', event => {
      if (siteMenu && menuToggle && !siteMenu.contains(event.target) && !menuToggle.contains(event.target)) {
        closeSiteMenu();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeSiteMenu();
    });

    function translateText(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement.closest('script, style')) continue;
        textNodes.push(node);
      }

      textNodes.forEach(textNode => {
        let text = textNode.nodeValue;
        Object.entries(translations)
          .sort(([first], [second]) => second.length - first.length)
          .forEach(([japanese, english]) => {
            text = text.split(japanese).join(english);
          });
        textNode.nodeValue = text;
      });

      root.querySelectorAll('[aria-label]').forEach(element => {
        const translated = translations[element.getAttribute('aria-label')];
        if (translated) element.setAttribute('aria-label', translated);
      });
    }

    document.querySelector('.language-button')?.addEventListener('click', event => {
      if (!isEnglish) {
        translateText(document.body);
        document.documentElement.lang = 'en';
        event.currentTarget.textContent = '日本語';
        event.currentTarget.setAttribute('aria-label', '日本語に戻す');
        isEnglish = true;
      } else {
        window.location.reload();
      }
    });

    const mainContent = document.querySelector('main');
    if (mainContent) {
      const observer = new MutationObserver(() => {
        if (isEnglish) translateText(mainContent);
      });
      observer.observe(mainContent, { childList: true, subtree: true });
    }
  </script>
</body>
</html>
